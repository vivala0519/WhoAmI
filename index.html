<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101722" />
    <script>
      try {
        const theme =
          localStorage.getItem("who-am-i-theme") === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "light" ? "#f4f6f9" : "#101722";
      } catch {}
    </script>
    <meta
      name="description"
      content="오늘의 챌린지 6가지, 무제한 7가지 단서. 기본 5번의 기회. 광고를 최대 3번 보고 1번씩 기회를 추가해 총 8번까지 도전하세요."
    />
    <title>WHO AM I? · 나는 누구일까요?</title>
    <link rel="icon" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
